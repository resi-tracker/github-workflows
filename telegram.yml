name: Send Telegram Notification

on:
  push:
    branches:
      - main

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send message to Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN=8510264299:AAF48QlDy-zd0mTRjEzslXiO7hIT4O6cm0A }}
        run: |
          CHAT_ID="491783582"
          MESSAGE="🚀 Repository kamu baru di-update!"
          curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_TOKEN/sendMessage" \
          -d chat_id=$CHAT_ID \
          -d text="$MESSAGE"
